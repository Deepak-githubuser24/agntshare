[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agntshare"
version = "0.1.0"
description = "HTTPS for AI Agent State. Lightweight, cryptographically verified Pathway Tokens to eliminate context bloat."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Deepak V", email = "techbit.ai.bytes@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=0.1.0"]

[project.urls]
Homepage = "https://agnt.sr"
Repository = "https://github.com/Deepak-githubuser24/agntshare"
"Bug Tracker" = "https://github.com/Deepak-githubuser24/agntshare/issues"
